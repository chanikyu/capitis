<!doctype html>
<!-- Capitis 미팅 손님 페이지(사용자 요청 2026-11-24 '앱 없는 사람은 링크로 브라우저에서'): chanikyu/capitis GitHub Pages 의 meet/ 에 그대로 올린다(대빵이 배포 때).
     주소 꼴: https://chanikyu.github.io/capitis/meet/#<코드> — 코드는 # 뒤라 GitHub 서버로 가지 않는다. 모든 파일은 이 폴더 안 상대 경로. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' https://gvumqixbeqqaivpecnms.supabase.co wss://*.livekit.cloud https://*.livekit.cloud; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Capitis 미팅 · Meeting</title>
<link rel="stylesheet" href="meet.css">
</head>
<body>
<main id="join" class="join">
  <form id="join-form" class="join-card" novalidate>
    <p class="brand">Capitis</p>
    <h1 data-t="title">회의에 참여하기</h1>
    <label for="join-name" class="field-name" data-t="name">이름</label>
    <input id="join-name" maxlength="60" autocomplete="name" data-t-placeholder="namePlaceholder" placeholder="다른 참가자에게 보일 이름">
    <p class="muted" data-t="note">카메라와 마이크는 들어간 뒤 켜고 끌 수 있습니다. 말한 내용은 회의록을 만들려고 주최자 쪽 Capitis 에서 글로 바뀝니다.</p>
    <button id="join-go" type="submit" class="primary" data-t="join">참여하기</button>
    <p id="join-status" class="status" role="status" aria-live="polite"></p>
    <p class="lang"><button type="button" data-lang="ko">한국어</button> · <button type="button" data-lang="en">English</button></p>
  </form>
</main>

<section id="room" class="room" aria-labelledby="room-title" hidden>
  <div class="room-bar">
    <strong id="room-title" class="room-title"></strong>
    <span id="room-clock" class="room-clock"></span>
    <span id="room-note" class="room-note" role="status" aria-live="polite"></span>
  </div>
  <div id="stage" class="stage"></div>
  <div class="controls" role="toolbar" data-t-label="controls" aria-label="회의 조작">
    <button type="button" id="mic" class="control" aria-pressed="true"></button>
    <button type="button" id="cam" class="control" aria-pressed="true"></button>
    <button type="button" id="screen" class="control" aria-pressed="false"></button>
    <span class="controls-gap"></span>
    <button type="button" id="leave" class="control is-leave"></button>
  </div>
  <div id="audio" hidden></div>
</section>

<main id="bye" class="join" hidden>
  <div class="join-card">
    <p class="brand">Capitis</p>
    <h1 id="bye-title"></h1>
    <p id="bye-text" class="muted"></p>
    <button id="bye-again" type="button" class="primary" data-t="again">다시 참여하기</button>
  </div>
</main>
<script src="livekit-client.umd.js"></script>
<script src="meet.js"></script>
</body>
</html>
